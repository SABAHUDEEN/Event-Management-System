<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Profile - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="row">
      <div class="col-4">
        <div class="card text-center">
          <div class="card-header">Company Logo</div>
          <div class="card-body">
            <img id="logoImg" src="" style="max-height:150px;display:none;" class="mb-2">
            <form id="logoForm">
              <input type="file" name="logo" accept="image/*" required>
              <button type="submit" class="btn btn-royal w-100 mt-2">Upload Logo</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-8">
        <div class="card">
          <div class="card-header">Company Details</div>
          <div class="card-body">
            <form id="detailsForm">
              <div class="row">
                <div class="col form-group"><label>Company Name</label><input type="text" name="companyname" required></div>
                <div class="col form-group"><label>Registration Number</label><input type="text" name="regno"></div>
              </div>
              <div class="row">
                <div class="col form-group"><label>Company Email</label><input type="email" name="companyemail"></div>
                <div class="col form-group"><label>Phone</label><input type="text" name="mobilenumber"></div>
              </div>
              <div class="form-group"><label>Address</label><textarea name="companyaddress" rows="3"></textarea></div>
              <button type="submit" class="btn btn-royal">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const API_ORIGIN = API_BASE.replace('/api', '');

    async function load() {
      try {
        const { company } = await api.get('/company');
        if (!company) return;
        const f = document.getElementById('detailsForm');
        f.companyname.value = company.companyname || '';
        f.regno.value = company.regno || '';
        f.companyemail.value = company.companyemail || '';
        f.mobilenumber.value = company.companyphone || '';
        f.companyaddress.value = company.companyaddress || '';
        if (company.companylogo) {
          const img = document.getElementById('logoImg');
          img.src = API_ORIGIN + '/uploads/logos/' + company.companylogo;
          img.style.display = 'inline-block';
          img.onerror = () => img.style.display = 'none';
        }
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }

    document.getElementById('detailsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      try {
        const data = await api.put('/company', body);
        showAlert('alertBox', data.message, 'success');
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    });

    document.getElementById('logoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api.postForm('/company/logo', new FormData(e.target));
        showAlert('alertBox', data.message, 'success');
        load();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    });

    load();
  </script>
</body>
</html>
