<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, var(--re-primary-dark), var(--re-primary));">
    <div class="card" style="max-width:420px;width:92%;padding:2rem;border-radius:14px;">
      <h4 class="text-center mb-3">Reset Password</h4>
      <div id="alertBox"></div>
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label>Registered Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label>Registered Mobile Number</label>
          <input type="text" id="mobile" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit mobile number" required>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newpassword" minlength="6" pattern="(?=.*[A-Za-z])(?=.*\d).{6,}" title="At least 6 characters, including a letter and a number" required>
        </div>
        <button type="submit" class="btn btn-royal w-100">Reset Password</button>
        <p class="text-center mt-3"><a href="index.html" class="text-muted">Back to login</a></p>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    initPasswordToggles();
    const checkNewPassword = attachPasswordValidation(document.getElementById('newpassword'));

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!checkNewPassword()) {
        document.getElementById('newpassword').focus();
        return;
      }
      try {
        const data = await api.post('/auth/forgot-password', {
          email: document.getElementById('email').value,
          mobile: document.getElementById('mobile').value,
          newpassword: document.getElementById('newpassword').value
        });
        showAlert('alertBox', data.message + ' Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    });
  </script>
</body>
</html>
