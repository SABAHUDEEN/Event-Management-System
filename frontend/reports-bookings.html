<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Report - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="card">
      <div class="card-header">
        <span>Booking Report (All Bookings)</span>
        <button class="btn btn-royal btn-sm" onclick="window.print()">Print</button>
      </div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>#</th><th>Booking ID</th><th>Name</th><th>Mobile</th><th>Email</th><th>Event Date</th><th>Event Type</th><th>Booking Date</th><th>Status</th></tr></thead>
          <tbody id="rows"><tr><td colspan="9" class="text-center text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    async function load() {
      try {
        const { bookings } = await api.get('/reports/bookings');
        const rows = bookings.map((b, i) => {
          const badge = b.Status === 'Approved' ? 'badge-success'
            : b.Status === 'Cancelled' ? 'badge-danger' : 'badge-secondary';
          return `<tr>
            <td>${i + 1}</td><td>${b.BookingID}</td><td>${b.Name}</td><td>${b.MobileNumber}</td>
            <td>${b.Email}</td><td>${b.EventDate}</td><td>${b.EventType}</td><td>${b.BookingDate}</td>
            <td><span class="badge ${badge}">${b.Status || 'Pending'}</span></td>
          </tr>`;
        }).join('');
        document.getElementById('rows').innerHTML = rows ||
          '<tr><td colspan="9" class="text-center text-muted">No bookings found.</td></tr>';
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }
    load();
  </script>
</body>
</html>
