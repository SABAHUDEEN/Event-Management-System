<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Services - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="card">
      <div class="card-header">
        <span>Manage Services</span>
        <button class="btn btn-royal btn-sm" id="openAdd" style="display:none;">+ Add Service</button>
      </div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Description</th><th>Price</th><th>Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const currentUser = Auth.getUser();
    const isAdmin = currentUser && currentUser.adminName === 'Admin';
    if (isAdmin) document.getElementById('openAdd').style.display = '';

    async function load() {
      try {
        const { services } = await api.get('/services');
        const rows = services.map((s, i) => `
          <tr>
            <td>${i + 1}</td><td>${s.ServiceName}</td><td>${s.SerDes}</td><td>₹${s.ServicePrice}</td>
            <td>${isAdmin ? `
              <button class="btn btn-sm btn-royal" onclick="openEdit(${s.ID})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="removeService(${s.ID})">Delete</button>
            ` : `<span class="badge badge-secondary">View only</span>`}</td>
          </tr>`).join('');
        document.getElementById('rows').innerHTML = rows ||
          '<tr><td colspan="5" class="text-center text-muted">No services yet.</td></tr>';
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }

    document.getElementById('openAdd').addEventListener('click', () => {
      if (!isAdmin) return;
      Modal.open('Add Service', `
        <form id="addForm">
          <div class="form-group"><label>Service Name</label><input type="text" name="servicename" required></div>
          <div class="form-group"><label>Description</label><textarea name="servicedes" rows="3" required></textarea></div>
          <div class="form-group"><label>Price (₹)</label><input type="number" name="price" required></div>
          <button type="submit" class="btn btn-royal w-100">Save</button>
        </form>`);
      document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          const data = await api.post('/services', body);
          Modal.close();
          showAlert('alertBox', data.message, 'success');
          load();
        } catch (err) { alert(err.message); }
      });
    });

    async function openEdit(id) {
      if (!isAdmin) return;
      const { service } = await api.get('/services/' + id);
      Modal.open('Edit Service', `
        <form id="editForm">
          <div class="form-group"><label>Service Name</label><input type="text" name="servicename" value="${service.ServiceName}" required></div>
          <div class="form-group"><label>Description</label><textarea name="servicedes" rows="3" required>${service.SerDes}</textarea></div>
          <div class="form-group"><label>Price (₹)</label><input type="number" name="price" value="${service.ServicePrice}" required></div>
          <button type="submit" class="btn btn-royal w-100">Update</button>
        </form>`);
      document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          const data = await api.put('/services/' + id, body);
          Modal.close();
          showAlert('alertBox', data.message, 'success');
          load();
        } catch (err) { alert(err.message); }
      });
    }

    async function removeService(id) {
      if (!isAdmin) return;
      if (!confirm('Delete this service?')) return;
      try {
        const data = await api.del('/services/' + id);
        showAlert('alertBox', data.message, 'success');
        load();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    }

    load();
  </script>
</body>
</html>
