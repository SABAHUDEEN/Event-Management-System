<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card" style="max-width:420px;width:92%;padding:2rem;">
      <div class="text-center mb-3">
        <div style="font-size:2.5rem;">✦</div>
        <h4 class="text-muted">Welcome To The Food Bros!</h4>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-royal w-100">SIGN IN</button>
        <p class="text-center mt-3"><a href="forgot-password.html" class="text-muted">Forgot Password?</a></p>
      </form>
      
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    initPasswordToggles();
    // If already logged in, skip straight to the dashboard.
    if (Auth.getToken()) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const data = await api.post('/auth/login', { username, password });
        Auth.setSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    });
  </script>
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--re-primary-dark), var(--re-primary)); }
    .auth-card { border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  </style>
</body>
</html>
