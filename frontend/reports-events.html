<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events List Report - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="card">
      <div class="card-header">
        <span>Events List Report</span>
        <button class="btn btn-royal btn-sm" onclick="window.print()">Print</button>
      </div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>#</th><th>Event Type</th><th>Creation Date</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3" class="text-center text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    async function load() {
      try {
        const { eventTypes } = await api.get('/reports/events');
        const rows = eventTypes.map((e, i) => `
          <tr><td>${i + 1}</td><td>${e.EventType}</td><td>${e.CreationDate}</td></tr>`).join('');
        document.getElementById('rows').innerHTML = rows ||
          '<tr><td colspan="3" class="text-center text-muted">No event types found.</td></tr>';
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }
    load();
  </script>
</body>
</html>
