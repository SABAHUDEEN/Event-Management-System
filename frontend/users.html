<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Users - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="card">
      <div class="card-header">
        <span>Manage Users</span>
        <button class="btn btn-royal btn-sm" id="openAdd">+ Add User</button>
      </div>
      <div class="card-body" style="overflow-x:auto;">
        <table>
          <thead><tr><th>#</th><th>Staff ID</th><th>Role</th><th>Username</th><th>Name</th><th>Mobile</th><th>Email</th><th>Action</th></tr></thead>
          <tbody id="rows"><tr><td colspan="8" class="text-center text-muted">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();

    async function load() {
      try {
        const { users } = await api.get('/users');
        const rows = users.map((u, i) => `
          <tr>
            <td>${i + 1}</td><td>${u.Staffid || ''}</td>
            <td><span class="badge badge-secondary">${u.AdminName}</span></td>
            <td>${u.UserName}</td><td>${u.FirstName} ${u.LastName}</td>
            <td>${u.MobileNumber || ''}</td><td>${u.Email || ''}</td>
            <td>
              <button class="btn btn-sm btn-royal" onclick="openEdit(${u.ID})">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="blockUser(${u.ID})">Block</button>
            </td>
          </tr>`).join('');
        document.getElementById('rows').innerHTML = rows ||
          '<tr><td colspan="8" class="text-center text-muted">No users yet.</td></tr>';
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }

    document.getElementById('openAdd').addEventListener('click', () => {
      Modal.open('Add User', `
        <form id="addForm" novalidate>
          <div class="row">
            <div class="col form-group"><label>Staff ID</label><input type="text" name="staffid" required></div>
            <div class="col form-group"><label>Role</label>
              <select name="dignity" required><option value="Admin">Admin</option><option value="User">User</option></select></div>
          </div>
          <div class="row">
            <div class="col form-group"><label>Username</label><input type="text" name="username" required></div>
            <div class="col form-group"><label>Password</label><input type="password" name="password" minlength="6" pattern="(?=.*[A-Za-z])(?=.*\d).{6,}" title="At least 6 characters, including a letter and a number" required></div>
          </div>
          <div class="row">
            <div class="col form-group"><label>First Name</label><input type="text" name="firstname" required></div>
            <div class="col form-group"><label>Last Name</label><input type="text" name="lastname" required></div>
          </div>
          <div class="row">
            <div class="col form-group"><label>Mobile Number</label><input type="text" name="mobile" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit mobile number" required></div>
            <div class="col form-group"><label>Email</label><input type="email" name="email" required></div>
          </div>
          <button type="submit" class="btn btn-royal w-100">Create User</button>
        </form>`, 'modal-lg');

      const pwInput = document.querySelector('#addForm input[name="password"]');
      initPasswordToggles(document.getElementById('appModalBody'));
      const checkPassword = attachPasswordValidation(pwInput);

      document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!checkPassword()) {
          pwInput.focus();
          return;
        }
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          const data = await api.post('/users', body);
          Modal.close();
          showAlert('alertBox', data.message, 'success');
          load();
        } catch (err) { alert(err.message); }
      });
    });

    async function openEdit(id) {
      const { user } = await api.get('/users/' + id);
      Modal.open('Edit User', `
        <form id="editForm">
          <div class="row">
            <div class="col form-group"><label>Username</label><input type="text" name="username" value="${user.UserName}" required></div>
            <div class="col form-group"><label>Email</label><input type="email" name="email" value="${user.Email || ''}" required></div>
          </div>
          <div class="row">
            <div class="col form-group"><label>First Name</label><input type="text" name="firstname" value="${user.FirstName || ''}" required></div>
            <div class="col form-group"><label>Last Name</label><input type="text" name="lastname" value="${user.LastName || ''}" required></div>
          </div>
          <div class="form-group"><label>Mobile Number</label><input type="text" name="mobile" value="${user.MobileNumber || ''}" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit mobile number" required></div>
          <button type="submit" class="btn btn-royal w-100">Update</button>
        </form>`, 'modal-lg');

      document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(e.target).entries());
        try {
          const data = await api.put('/users/' + id, body);
          Modal.close();
          showAlert('alertBox', data.message, 'success');
          load();
        } catch (err) { alert(err.message); }
      });
    }

    async function blockUser(id) {
      if (!confirm('Block this user?')) return;
      try {
        const data = await api.post('/users/' + id + '/block');
        showAlert('alertBox', data.message, 'success');
        load();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    }

    load();
  </script>
</body>
</html>
