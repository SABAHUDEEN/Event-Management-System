<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div class="row" style="justify-content:center;">
      <div class="col-4" style="min-width:400px;">
        <div id="alertBox"></div>
        <div class="card">
          <div class="card-header">Change Password</div>
          <div class="card-body">
            <form id="pwForm" novalidate>
              <div class="form-group"><label>Current Password</label><input type="password" name="currentpassword" required></div>
              <div class="form-group"><label>New Password</label><input type="password" name="newpassword" minlength="6" pattern="(?=.*[A-Za-z])(?=.*\d).{6,}" title="At least 6 characters, including a letter and a number" required></div>
              <div class="form-group"><label>Confirm New Password</label><input type="password" name="confirmpassword" minlength="6" required></div>
              <button type="submit" class="btn btn-royal w-100">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/password-toggle.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    initPasswordToggles();
    const newPwInput = document.querySelector('input[name="newpassword"]');
    const confirmPwInput = document.querySelector('input[name="confirmpassword"]');
    const checkNewPassword = attachPasswordValidation(newPwInput);

    document.getElementById('pwForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!document.querySelector('input[name="currentpassword"]').value) {
        showAlert('alertBox', 'Please enter your current password.', 'error');
        return;
      }
      if (!checkNewPassword()) {
        newPwInput.focus();
        return;
      }
      if (newPwInput.value !== confirmPwInput.value) {
        showAlert('alertBox', 'New password and confirm password do not match.', 'error');
        confirmPwInput.focus();
        return;
      }
      const body = Object.fromEntries(new FormData(e.target).entries());
      try {
        const data = await api.post('/profile/change-password', body);
        showAlert('alertBox', data.message, 'success');
        e.target.reset();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    });
  </script>
</body>
</html>
