<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile - The Food Bros Event</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>
  <div class="container">
    <div id="alertBox"></div>
    <div class="row">
      <div class="col-4">
        <div class="card text-center">
          <div class="card-header">Profile Photo</div>
          <div class="card-body">
            <img id="photoImg" src="" style="width:120px;height:120px;object-fit:cover;border-radius:50%;display:none;" class="mb-2">
            <form id="photoForm">
              <input type="file" name="photo" accept="image/*" required>
              <button type="submit" class="btn btn-royal w-100 mt-2">Upload Photo</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-8">
        <div class="card">
          <div class="card-header">My Details</div>
          <div class="card-body">
            <form id="detailsForm">
              <div class="row">
                <div class="col form-group"><label>Username</label><input type="text" name="adminname" required></div>
                <div class="col form-group"><label>Email</label><input type="email" name="email" required></div>
              </div>
              <div class="row">
                <div class="col form-group"><label>First Name</label><input type="text" name="firstname" required></div>
                <div class="col form-group"><label>Last Name</label><input type="text" name="lastname" required></div>
              </div>
              <div class="form-group"><label>Mobile Number</label><input type="text" name="mobilenumber" pattern="[0-9]{10}" maxlength="10" inputmode="numeric" title="Enter a valid 10-digit mobile number" required></div>
              <button type="submit" class="btn btn-royal">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const API_ORIGIN = API_BASE.replace('/api', '');

    async function load() {
      try {
        const { admin } = await api.get('/profile');
        if (!admin) return;
        const f = document.getElementById('detailsForm');
        f.adminname.value = admin.UserName || '';
        f.email.value = admin.Email || '';
        f.firstname.value = admin.FirstName || '';
        f.lastname.value = admin.LastName || '';
        f.mobilenumber.value = admin.MobileNumber || '';
        if (admin.Photo && admin.Photo !== 'avatar15.jpg') {
          const img = document.getElementById('photoImg');
          img.src = API_ORIGIN + '/uploads/profiles/' + admin.Photo;
          img.style.display = 'inline-block';
          img.onerror = () => img.style.display = 'none';
        }
      } catch (err) {
        showAlert('alertBox', err.message, 'error');
      }
    }

    document.getElementById('detailsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target).entries());
      try {
        const data = await api.put('/profile', body);
        showAlert('alertBox', data.message, 'success');
        const user = Auth.getUser();
        user.userName = body.adminname;
        user.fullName = `${body.firstname} ${body.lastname}`.trim();
        Auth.setSession(Auth.getToken(), user);
        renderNav();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    });

    document.getElementById('photoForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await api.postForm('/profile/photo', new FormData(e.target));
        showAlert('alertBox', data.message, 'success');
        load();
      } catch (err) { showAlert('alertBox', err.message, 'error'); }
    });

    load();
  </script>
</body>
</html>
